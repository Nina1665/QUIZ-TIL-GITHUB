<!DOCTYPE html>
<html lang="da">
<head>
<title>Find Your EasyScore</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --gold: #B89056;
    --gold-dark: #9E7A44;
    --beige: #E6E0D9;
    --ground: #F6F3EE;
    --card: #FFFFFF;
    --ink: #101828;
    --grey: #475467;
    --grey-light: #98A2B3;
    --star-off: #D6CEC3;
    --radius: 14px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.5;
    min-height: 100vh;
  }
  .topbar {
    background: var(--card);
    border-bottom: 1px solid var(--beige);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .topbar img { height: 44px; width: auto; display: block; }
  .lang { display: flex; gap: 4px; }
  .lang button {
    font-family: var(--font);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    padding: 6px 10px;
    border: 1px solid var(--beige);
    background: var(--card);
    color: var(--grey);
    border-radius: 999px;
    cursor: pointer;
  }
  .lang button.active {
    background: var(--gold);
    border-color: var(--gold);
    color: #fff;
  }
  .wrap {
    max-width: 520px;
    margin: 0 auto;
    padding: 20px 20px 48px;
  }
  .hero {
    background: var(--beige);
    border-radius: var(--radius);
    padding: 34px 26px 30px;
    text-align: center;
    margin-bottom: 18px;
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: lowercase;
    color: var(--grey);
    margin: 0 0 10px;
  }
  .hero h1 {
    font-size: clamp(26px, 7vw, 34px);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0;
    text-wrap: balance;
  }
  .hero .stars-demo {
    color: var(--gold);
    font-size: 20px;
    letter-spacing: 0.15em;
    margin-top: 14px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--beige);
    border-radius: var(--radius);
    padding: 26px 22px;
  }
  .intro-text { color: var(--grey); margin: 0 0 18px; text-align: center; }
  .scale {
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--ground);
    border-radius: 12px;
    padding: 14px 18px;
    margin: 0 0 18px;
  }
  .scale-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .scale-row .s-stars {
    color: var(--gold);
    letter-spacing: 0.1em;
    font-size: 16px;
    white-space: nowrap;
  }
  .scale-row .s-stars .off { color: var(--star-off); }
  .scale-row .s-label { color: var(--grey); font-size: 14px; text-align: right; }
  .btn {
    display: block;
    width: 100%;
    font-family: var(--font);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.04em;
    background: var(--gold);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 15px 24px;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
  }
  .btn:hover { background: var(--gold-dark); }
  .btn:focus-visible, .answer:focus-visible, .lang button:focus-visible,
  .textlink:focus-visible, .plant:focus-visible, .search input:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 2px;
  }
  .progress { margin: 4px 2px 10px; }
  .progress .count { font-size: 13px; color: var(--grey-light); }
  .bar {
    height: 6px;
    background: var(--beige);
    border-radius: 999px;
    overflow: hidden;
    margin: 0 2px 18px;
  }
  .bar-fill {
    height: 100%;
    width: 0;
    background: var(--gold);
    border-radius: 999px;
    transition: width 0.4s ease;
  }
  .question h2 {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 18px;
    text-wrap: balance;
  }
  .answers { display: flex; flex-direction: column; gap: 10px; }
  .answer {
    font-family: var(--font);
    font-size: 15px;
    text-align: left;
    background: var(--card);
    color: var(--ink);
    border: 1.5px solid var(--beige);
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .answer:hover { border-color: var(--gold); }
  .answer.picked {
    border-color: var(--gold);
    background: #FBF7F1;
  }
  .backrow { margin-top: 16px; text-align: center; }
  .textlink {
    font-family: var(--font);
    font-size: 13px;
    color: var(--grey);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .result-head { text-align: center; padding: 6px 0 2px; }
  .result-head .kicker {
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--grey-light);
    margin: 0 0 12px;
  }
  .result-head .bigstars {
    font-size: 34px;
    letter-spacing: 0.1em;
    color: var(--gold);
    line-height: 1;
  }
  .result-head .bigstars .off { color: var(--star-off); }
  .result-head .level {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 10px 0 0;
  }
  .result-head .tagline {
    font-size: 18px;
    font-weight: 700;
    margin: 14px 0 6px;
  }
  .result-head .desc { color: var(--grey); margin: 0 auto 20px; max-width: 42ch; }
  .callout {
    background: var(--beige);
    border-radius: 12px;
    padding: 16px 18px;
    text-align: center;
    margin-bottom: 8px;
  }
  .callout .c-stars {
    color: var(--gold);
    font-size: 22px;
    letter-spacing: 0.12em;
    display: block;
    margin-bottom: 4px;
  }
  .callout .c-stars .off { color: #FFF; }
  .callout .c-text { font-size: 14.5px; color: var(--ink); font-weight: 600; }
  .listhead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin: 22px 2px 4px;
  }
  .listhead h3 { font-size: 16px; font-weight: 700; margin: 0; }
  .listhead .n { font-size: 13px; color: var(--grey-light); white-space: nowrap; }
  .listnote { font-size: 12.5px; color: var(--grey-light); margin: 0 2px 12px; }
  .plants {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .plant {
    display: block;
    text-decoration: none;
    background: var(--card);
    border: 1px solid var(--beige);
    border-radius: 10px;
    overflow: hidden;
    transition: border-color 0.15s;
  }
  .plant:hover { border-color: var(--gold); }
  .plant .ph {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
    background: var(--ground);
  }
  .plant .noimg {
    width: 100%;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--beige);
    color: var(--gold);
    font-size: 26px;
  }
  .plant .pname {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.35;
    color: var(--ink);
    padding: 8px 10px 3px;
    display: block;
    overflow-wrap: break-word;
  }
  .plant .pmore {
    font-size: 11.5px;
    color: var(--gold);
    padding: 0 10px 10px;
    display: block;
  }
  .retake { margin-top: 20px; text-align: center; }
  footer {
    text-align: center;
    font-size: 12px;
    color: var(--grey-light);
    padding: 0 20px 30px;
  }
  .fade { animation: fadeIn 0.25s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .fade { animation: none; }
    .answer, .plant, .bar-fill { transition: none; }
  }
  .admin-wrap { max-width: 880px; margin: 0 auto; padding: 20px 20px 48px; }
  .admin-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .admin-head h1 { font-size: 22px; margin: 0; }
  .admin-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 22px; }
  .admin-stat { background: var(--card); border: 1px solid var(--beige); border-radius: 12px; padding: 14px 16px; }
  .admin-stat .n { font-size: 24px; font-weight: 700; color: var(--gold); }
  .admin-stat .l { font-size: 12.5px; color: var(--grey); }
  .admin-table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--beige); border-radius: 12px; overflow: hidden; font-size: 13.5px; }
  .admin-table th, .admin-table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--beige); }
  .admin-table th { color: var(--grey); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  .admin-empty { color: var(--grey); padding: 20px 0; }
  .admin-btn { display: inline-block; font-family: var(--font); font-size: 13px; font-weight: 600; background: var(--gold); color: #fff; border: none; border-radius: 999px; padding: 9px 18px; cursor: pointer; margin-bottom: 18px; }
  .admin-btn:hover { background: var(--gold-dark); }
  /* ---- Ny forside ---- */
  .hero { position: relative; overflow: hidden; padding: 30px 26px 26px; }
  .hero > *:not(.hero-leaf) { position: relative; z-index: 1; }
  .hero-leaf { position: absolute; z-index: 0; color: var(--gold); opacity: 0.16; pointer-events: none; }
  .hero-leaf.l1 { width: 120px; left: -26px; bottom: -22px; transform: rotate(18deg); }
  .hero-leaf.l2 { width: 96px; right: -20px; top: -18px; transform: rotate(-150deg); }
  .stars-demo span { display: inline-block; animation: starpop 0.5s cubic-bezier(.2,.9,.3,1.4) both; }
  .stars-demo span:nth-child(1) { animation-delay: 0.10s; }
  .stars-demo span:nth-child(2) { animation-delay: 0.22s; }
  .stars-demo span:nth-child(3) { animation-delay: 0.34s; }
  .stars-demo span:nth-child(4) { animation-delay: 0.46s; }
  .stars-demo span:nth-child(5) { animation-delay: 0.58s; }
  @keyframes starpop { from { opacity: 0; transform: scale(0.3) rotate(-25deg); } to { opacity: 1; transform: none; } }
  .start-title { font-size: clamp(22px, 6vw, 26px); line-height: 1.2; font-weight: 700; text-align: center; margin: 2px 0 10px; text-wrap: balance; }
  .start-lead { text-align: center; color: var(--grey); margin: 0 0 16px; text-wrap: balance; }
  .chips { list-style: none; padding: 0; margin: 0 0 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .chips li { font-size: 13px; font-weight: 600; color: var(--gold-dark); background: #FBF7F1; border: 1px solid var(--beige); border-radius: 999px; padding: 6px 13px; }
  .chips li::before { content: "\2713\00a0"; color: var(--gold); }
  .btn-cta { font-size: 17px; padding: 18px 24px; box-shadow: 0 6px 16px rgba(184,144,86,0.32); transition: background 0.15s, transform 0.15s, box-shadow 0.15s; }
  .btn-cta:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(184,144,86,0.4); }
  .btn-cta:active { transform: translateY(0); }
  .btn-cta span { display: inline-block; margin-left: 6px; transition: transform 0.15s; }
  .btn-cta:hover span { transform: translateX(3px); }
  .fineprint { font-size: 12px; color: var(--grey-light); text-align: center; margin: 12px 0 0; }
  .easy { margin-top: 24px; padding-top: 22px; border-top: 1px solid var(--beige); }
  .easy-title { font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--grey-light); text-align: center; margin: 0 0 8px; }
  .easy-text { text-align: center; color: var(--grey); margin: 0 0 14px; text-wrap: balance; }
  .easy .scale { margin-bottom: 0; }
  .easy .scale-row { align-items: center; }
  .s-label strong { display: block; color: var(--ink); font-size: 14px; font-weight: 600; }
  .s-label small { display: block; color: var(--grey); font-size: 12.5px; }
  @media (prefers-reduced-motion: reduce) {
    .stars-demo span { animation: none; }
    .btn-cta, .btn-cta span { transition: none; }
  }
</style>
</head>

var START_PREFIX = "easycare-quiz-start:";

async function saveStart() {
  try {
    if (!window.storage || !window.storage.set) return;
    var id = START_PREFIX + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
    await window.storage.set(id, JSON.stringify({ ts: Date.now(), lang: state.lang }), true);
  } catch (e) {
    console.error("Could not save quiz start", e);
  }
}

function startQuiz() {
  saveStart();
  go(0);
}

async function saveResponse(key, sum) {
  if (state.saved) return;
  state.saved = true;
  try {
    if (!window.storage || !window.storage.set) return;
    var id = STORAGE_PREFIX + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
    var payload = { ts: Date.now(), lang: state.lang, answers: state.answers, level: key, sum: sum };
    await window.storage.set(id, JSON.stringify(payload), true);
  } catch (e) {
    console.error("Could not save quiz response", e);
  }
}

function detectLang() {
  var l = (navigator.language || "").toLowerCase();
  return l.indexOf("da") === 0 ? "da" : l.indexOf("de") === 0 ? "de" : "en";
}

function setLang(lang) {
  state.lang = lang;
  ["da", "en", "de"].forEach(function(l) {
    document.getElementById("lang-" + l).className = lang === l ? "active" : "";
  });
  document.getElementById("hero-title").textContent = T[lang].heroTitle;
  document.documentElement.lang = lang;
  render();
}

function starRow(n) {
  var html = "";
  for (var i = 1; i <= 5; i++) {
    html += i <= n ? "<span class='on'>★</span>" : "<span class='off'>☆</span>";
  }
  return html;
}

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/'/g, "&#39;").replace(/"/g, "&quot;");
}

function plantCard(p) {
  var img = p.i
    ? "<img class='ph' loading='lazy' src='data:image/webp;base64," + p.i + "' alt=''>"
    : "<span class='noimg' aria-hidden='true'>✿</span>";
  return "<a class='plant' href='" + GUIDE + p.u + "' target='_blank' rel='noopener'>" +
    img + "<span class='pname'>" + esc(p.n) + "</span>" +
    "<span class='pmore'>" + T[state.lang].readMore + "</span></a>";
}

function render() {
  var t = T[state.lang];
  var app = document.getElementById("app");
  var html = "";

  if (state.step === -1) {
    html = "<div class='card fade'>" +
      "<h2 class='start-title'>" + t.startTitle + "</h2>" +
      "<p class='start-lead'>" + t.startLead + "</p>" +
      "<ul class='chips'>" + t.chips.map(function(c) { return "<li>" + c + "</li>"; }).join("") + "</ul>" +
      "<button class='btn btn-cta' onclick='startQuiz()'>" + t.start + " <span aria-hidden='true'>\u2192</span></button>" +
      "<div class='easy'>" +
      "<p class='easy-title'>" + t.easyTitle + "</p>" +
      "<p class='easy-text'>" + t.easyText + "</p>" +
      "<div class='scale'>" +
      "<div class='scale-row'><span class='s-stars'>" + starRow(5) + "</span><span class='s-label'><strong>" + t.scaleEasy + "</strong><small>" + t.scaleEasySub + "</small></span></div>" +
      "<div class='scale-row'><span class='s-stars'>" + starRow(2) + "</span><span class='s-label'><strong>" + t.scaleHard + "</strong><small>" + t.scaleHardSub + "</small></span></div>" +
      "</div></div>" +
      "</div>";
  } else if (state.step < 4) {
    var q = t.questions[state.step];
    html = "<div class='card fade'>" +
      "<div class='progress'>" +
      "<span class='count'>" + t.counter(state.step + 1) + "</span>" +
      "</div>" +
      "<div class='bar' role='progressbar' aria-valuemin='0' aria-valuemax='4' aria-valuenow='" + state.step + "'>" +
      "<div class='bar-fill' id='barfill' style='width:" + state.prevFill + "%'></div>" +
      "</div>" +
      "<div class='question'><h2>" + q.q + "</h2>" +
      "<div class='answers'>";
    for (var j = 0; j < q.a.length; j++) {
      html += "<button class='answer' onclick='pick(this," + (j + 1) + ")'>" + q.a[j] + "</button>";
    }
    html += "</div></div>";
    if (state.step > 0) {
      html += "<div class='backrow'><button class='textlink' onclick='goBack()'>" + t.back + "</button></div>";
    }
    html += "</div>";
  } else {
    var sum = state.answers.reduce(function(a, b) { return a + b; }, 0);
    var key = sum <= 6 ? "5" : sum <= 9 ? "4" : sum <= 12 ? "3" : "2";
    saveResponse(key, sum);
    var stars = STARS[key];
    var lt = t.levels[key];
    var plants = CATALOG[key];
    html = "<div class='card fade'>" +
      "<div class='result-head'>" +
      "<p class='kicker'>" + t.kicker + "</p>" +
      "<div class='bigstars' aria-label='" + stars + "/5'>" + starRow(stars) + "</div>" +
      "<p class='level'>" + LABELS[key] + "</p>" +
      "<p class='tagline'>" + lt.tagline + "</p>" +
      "<p class='desc'>" + lt.desc + "</p>" +
      "</div>" +
      "<div class='callout'>" +
      "<span class='c-stars' aria-hidden='true'>" + starRow(stars) + "</span>" +
      "<span class='c-text'>" + t.calloutText + "</span>" +
      "</div>" +
      "<div class='listhead'><h3>" + t.listTitle + "</h3>" +
      "<span class='n'>" + t.listCount(plants.length) + "</span></div>" +
      "<p class='listnote'>" + t.listNote + "</p>" +
      "<div class='plants' id='plantgrid'></div>" +
      "<div class='retake'><button class='textlink' onclick='restart()'>" + t.retake + "</button></div>" +
      "</div>";
  }
  app.innerHTML = html;
  if (state.step >= 4) renderPlants();
  if (state.step >= 0 && state.step < 4) {
    var target = ((state.step + 0.5) / 4) * 100;
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        var f = document.getElementById("barfill");
        if (f) f.style.width = target + "%";
      });
    });
    state.prevFill = target;
  } else if (state.step === -1) {
    state.prevFill = 0;
  }
}

function renderPlants() {
  var sum = state.answers.reduce(function(a, b) { return a + b; }, 0);
  var key = sum <= 6 ? "5" : sum <= 9 ? "4" : sum <= 12 ? "3" : "2";
  document.getElementById("plantgrid").innerHTML = CATALOG[key].map(plantCard).join("");
}

function go(step) { state.step = step; render(); window.scrollTo(0, 0); }

function pick(el, value) {
  var siblings = el.parentNode.children;
  for (var i = 0; i < siblings.length; i++) siblings[i].disabled = true;
  el.className = "answer picked";
  state.answers[state.step] = value;
  setTimeout(function() { go(state.step + 1); }, 280);
}

function goBack() {
  state.answers.splice(state.step - 1);
  go(state.step - 1);
}

function restart() {
  state.answers = [];
  state.saved = false;
  go(-1);
}

var ADMIN_KEY = "easycare2026";
var LEVEL_NAMES = { "5": "Super Easy", "4": "Very Easy", "3": "Quite Easy", "2": "Not That Easy" };

function isAdminView() {
  var params = new URLSearchParams(window.location.search);
  return params.get("data") === ADMIN_KEY;
}

function csvEscape(v) {
  var s = String(v);
  if (s.indexOf(",") !== -1 || s.indexOf('"') !== -1 || s.indexOf("\n") !== -1) {
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}

function downloadCSV(rows) {
  var header = ["timestamp", "date", "language", "level", "answer_1", "answer_2", "answer_3", "answer_4", "score"];
  var lines = [header.join(",")];
  rows.forEach(function(r) {
    var a = r.answers || [];
    lines.push([
      r.ts, new Date(r.ts).toISOString(), r.lang, LEVEL_NAMES[r.level] || r.level,
      a[0] || "", a[1] || "", a[2] || "", a[3] || "", r.sum
    ].map(csvEscape).join(","));
  });
  var blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8;" });
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement("a");
  a2.href = url;
  a2.download = "easycare-quiz-data.csv";
  document.body.appendChild(a2);
  a2.click();
  document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}

async function renderAdmin() {
  var app = document.getElementById("app");
  document.querySelector(".wrap").className = "admin-wrap";
  document.querySelector(".hero").style.display = "none";
  app.innerHTML = "<p class='admin-empty'>Indlæser data …</p>";

  var rows = [];
  var startCount = 0;
  try {
    var listRes = await window.storage.list(STORAGE_PREFIX, true);
    var keys = (listRes && listRes.keys) || [];
    for (var i = 0; i < keys.length; i++) {
      try {
        var r = await window.storage.get(keys[i], true);
        if (r && r.value) rows.push(JSON.parse(r.value));
      } catch (e) {}
    }
    var startList = await window.storage.list(START_PREFIX, true);
    startCount = ((startList && startList.keys) || []).length;
  } catch (e) {
    app.innerHTML = "<p class='admin-empty'>Kunne ikke hente data: " + e + "</p>";
    return;
  }

  rows.sort(function(a, b) { return b.ts - a.ts; });

  var counts = { "5": 0, "4": 0, "3": 0, "2": 0 };
  rows.forEach(function(r) { if (counts[r.level] !== undefined) counts[r.level]++; });

  var completeRate = startCount > 0 ? Math.round((rows.length / startCount) * 100) : 0;

  // Popularitet pr. spørgsmål (baseret på gennemførte svar, dansk tekst som reference)
  var qLabels = T.da.questions;
  var qTally = qLabels.map(function() { return {}; });
  rows.forEach(function(r) {
    (r.answers || []).forEach(function(val, qi) {
      if (!qTally[qi]) return;
      qTally[qi][val] = (qTally[qi][val] || 0) + 1;
    });
  });

  var html = "<div class='admin-head'><h1>EasyScore quiz — data</h1></div>";
  html += "<button class='admin-btn' id='csvBtn'>Download CSV (" + rows.length + " svar)</button>";
  html += "<div class='admin-stats'>";
  html += "<div class='admin-stat'><div class='n'>" + startCount + "</div><div class='l'>Startet</div></div>";
  html += "<div class='admin-stat'><div class='n'>" + rows.length + "</div><div class='l'>Gennemført</div></div>";
  html += "<div class='admin-stat'><div class='n'>" + completeRate + "%</div><div class='l'>Gennemførselsrate</div></div>";
  html += "</div>";
  html += "<div class='admin-stats'>";
  ["5", "4", "3", "2"].forEach(function(k) {
    html += "<div class='admin-stat'><div class='n'>" + counts[k] + "</div><div class='l'>" + LEVEL_NAMES[k] + "</div></div>";
  });
  html += "</div>";

  if (rows.length === 0) {
    html += "<p class='admin-empty'>Ingen gennemførte svar endnu. Del quizzen, så dukker data op her.</p>";
  } else {
    html += "<h3>Mest populære svar pr. spørgsmål</h3>";
    html += "<table class='admin-table'><thead><tr><th>Spørgsmål</th><th>Mest valgte svar</th><th>Antal</th></tr></thead><tbody>";
    qLabels.forEach(function(q, qi) {
      var tally = qTally[qi];
      var bestVal = null, bestCount = -1;
      Object.keys(tally).forEach(function(v) {
        if (tally[v] > bestCount) { bestCount = tally[v]; bestVal = v; }
      });
      var answerText = bestVal ? (q.a[Number(bestVal) - 1] || bestVal) : "—";
      html += "<tr><td>" + q.q + "</td><td>" + answerText + "</td><td>" + (bestCount > 0 ? bestCount : 0) + "</td></tr>";
    });
    html += "</tbody></table>";

    html += "<h3 style='margin-top:26px'>Alle gennemførte svar</h3>";
    html += "<table class='admin-table'><thead><tr><th>Dato</th><th>Sprog</th><th>Resultat</th><th>Svar (1-4 pr. spørgsmål)</th></tr></thead><tbody>";
    rows.forEach(function(r) {
      var d = new Date(r.ts);
      html += "<tr><td>" + d.toLocaleString() + "</td><td>" + r.lang + "</td><td>" + (LEVEL_NAMES[r.level] || r.level) + "</td><td>" + (r.answers || []).join(", ") + "</td></tr>";
    });
    html += "</tbody></table>";
  }

  app.innerHTML = html;
  var btn = document.getElementById("csvBtn");
  if (btn) btn.onclick = function() { downloadCSV(rows); };
}

if (isAdminView()) {
  renderAdmin();
} else {
  setLang(detectLang());
}
</script>
